<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Change Password</h4>
        </div>
        <div class="card-body">
          <div *ngIf="message" class="alert" [class.alert-success]="!isError" [class.alert-danger]="isError">
            {{ message }}
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Current Password</label>
              <input type="password" class="form-control" [(ngModel)]="currentPassword" name="currentPassword" required>
            </div>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control" [(ngModel)]="newPassword" name="newPassword" required>
              <small class="text-muted">Minimum 6 characters</small>
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
              {{ loading ? 'Changing...' : 'Change Password' }}
            </button>
          </form>
          
          <div class="mt-3 text-center">
            <a routerLink="/dashboard" class="btn btn-link">← Back to Dashboard</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
