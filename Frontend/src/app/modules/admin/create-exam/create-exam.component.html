<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4>Create New Exam</h4>
        </div>
        <div class="card-body">
          <div *ngIf="message" class="alert" [class.alert-success]="!isError" [class.alert-danger]="isError">
            {{ message }}
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Exam Title *</label>
              <input type="text" class="form-control" [(ngModel)]="title" name="title" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" [(ngModel)]="description" name="description" rows="3"></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Duration (minutes)</label>
                <input type="number" class="form-control" [(ngModel)]="duration" name="duration">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Total Marks</label>
                <input type="number" class="form-control" [(ngModel)]="totalMarks" name="totalMarks">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
              {{ loading ? 'Creating...' : 'Create Exam' }}
            </button>
          </form>

          <div class="mt-3 text-center">
            <a routerLink="/admin">← Back to Dashboard</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
