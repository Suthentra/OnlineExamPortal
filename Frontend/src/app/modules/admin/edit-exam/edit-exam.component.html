<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-warning text-white">
          <h4>Edit Exam</h4>
        </div>
        <div class="card-body">
          <div *ngIf="message" class="alert" [class.alert-success]="!isError" [class.alert-danger]="isError">
            {{ message }}
          </div>

          <form (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label">Exam Title</label>
              <input type="text" class="form-control" [(ngModel)]="exam.title" name="title" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" [(ngModel)]="exam.description" name="description" rows="3"></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Duration (minutes)</label>
                <input type="number" class="form-control" [(ngModel)]="exam.durationInMinutes" name="duration">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Total Marks</label>
                <input type="number" class="form-control" [(ngModel)]="exam.totalMarks" name="totalMarks">
              </div>
            </div>

            <div class="mb-3">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" [(ngModel)]="exam.isPublished" name="isPublished">
                <label class="form-check-label">Published</label>
              </div>
            </div>

            <button type="submit" class="btn btn-warning w-100" [disabled]="loading">
              {{ loading ? 'Updating...' : 'Update Exam' }}
            </button>
          </form>

          <div class="mt-3 text-center">
            <button class="btn btn-link" (click)="goBack()">← Back to Dashboard</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
