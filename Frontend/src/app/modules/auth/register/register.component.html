<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <i class="fas fa-user-plus"></i>
      </div>
      <h2>Create Account</h2>
      <p>Join us and start your exam journey</p>
    </div>

    <div *ngIf="successMessage" class="alert alert-success">
      <i class="fas fa-check-circle"></i> {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-danger">
      <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-group">
          <i class="fas fa-user"></i>
          <input type="text" [(ngModel)]="fullName" name="fullName" placeholder="Enter your full name" required>
        </div>
      </div>

      <div class="form-group">
  <label>Email Address</label>
  <div class="input-group">
    <i class="fas fa-envelope"></i>
    <input type="email" 
           [(ngModel)]="email" 
           name="email" 
           (input)="validateEmail()"
           placeholder="Enter your email" 
           required>
  </div>
  <small *ngIf="email && !isValidEmail(email)" class="text-danger">
    Please enter a valid email address
  </small>
  <small *ngIf="email && isValidEmail(email)" class="text-success">
    ✓ Valid email format
  </small>
</div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" [(ngModel)]="password" name="password" placeholder="Create a password" required>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="!loading">Create Account</span>
        <span *ngIf="loading">Creating...</span>
      </button>

      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/login">Sign in</a></p>
      </div>
    </form>
  </div>
</div>
