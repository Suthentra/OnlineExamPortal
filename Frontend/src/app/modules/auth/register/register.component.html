<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-header bg-success text-white">
          <h4>Register</h4>
        </div>
        <div class="card-body">
          <div *ngIf="message" [class.alert-success]="!isError" [class.alert-danger]="isError" class="alert">{{ message }}</div>
          <form (ngSubmit)="onSubmit()">
            <input type="text" class="form-control mb-2" placeholder="Full Name" [(ngModel)]="fullName" name="fullName">
            <input type="email" class="form-control mb-2" placeholder="Email" [(ngModel)]="email" name="email">
            <input type="password" class="form-control mb-2" placeholder="Password" [(ngModel)]="password" name="password">
            <input type="password" class="form-control mb-2" placeholder="Confirm Password" [(ngModel)]="confirmPassword" name="confirm">
            <button class="btn btn-success w-100" [disabled]="loading">{{ loading ? 'Registering...' : 'Register' }}</button>
          </form>
          <a routerLink="/login" class="btn btn-link">Back to Login</a>
        </div>
      </div>
    </div>
  </div>
</div>
