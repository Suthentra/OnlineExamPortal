<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <i class="fas fa-graduation-cap"></i>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to continue your learning journey</p>
    </div>

    <!-- ===== REACTIVE FORM ===== -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <!-- Email -->
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-group" 
             [class.is-valid]="emailExists && !loginError && f['email'].value"
             [class.is-invalid]="emailChecked && !emailExists && f['email'].value">
          <i class="fas fa-envelope"></i>
          <input type="email" 
                 formControlName="email" 
                 placeholder="Enter your email"
                 (blur)="checkEmailExists()"
                 [class.is-valid]="emailExists && !loginError && f['email'].value"
                 [class.is-invalid]="emailChecked && !emailExists && f['email'].value">
          <i *ngIf="checkingEmail" class="fas fa-spinner fa-spin" style="padding-right: 12px; color: #4361ee;"></i>
        </div>
        
        <!-- Email validation messages -->
        <div *ngIf="f['email'].touched || submitted">
          <div *ngIf="f['email'].errors?.['required']" class="error-message">
            <i class="fas fa-exclamation-circle"></i> Email is required
          </div>
          <div *ngIf="f['email'].invalid && f['email'].errors?.['pattern'] && f['email'].touched" class="error-message">
            <i class="fas fa-exclamation-circle"></i> Please enter a valid email address
          </div>
          <div *ngIf="emailChecked && !emailExists && f['email'].value && !f['email'].invalid" class="error-message">
            <i class="fas fa-exclamation-circle"></i> Email not found. Please check your email or create an account.
          </div>
          <div *ngIf="emailExists && f['email'].value && !loginError" class="success-message">
            <i class="fas fa-check-circle"></i> Email verified
          </div>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <div class="input-group" 
             [class.is-valid]="!loginError && passwordVerified && f['password'].value"
             [class.is-invalid]="loginError && passwordTouched">
          <i class="fas fa-lock"></i>
          <input type="password" 
                 formControlName="password" 
                 placeholder="Enter your password"
                 (input)="onPasswordInput()"
                 [class.is-valid]="!loginError && passwordVerified && f['password'].value"
                 [class.is-invalid]="loginError && passwordTouched">
          <i *ngIf="checkingPassword" class="fas fa-spinner fa-spin" style="padding-right: 12px; color: #4361ee;"></i>
        </div>
        
        <!-- Password validation messages -->
        <div *ngIf="f['password'].touched || submitted">
          <div *ngIf="f['password'].errors?.['required']" class="error-message">
            <i class="fas fa-exclamation-circle"></i> Password is required
          </div>
          <div *ngIf="loginError && passwordTouched" class="error-message">
            <i class="fas fa-exclamation-circle"></i> {{ loginError }}
          </div>
          <div *ngIf="!loginError && passwordVerified && f['password'].value && emailExists" class="success-message">
            <i class="fas fa-check-circle"></i> Password verified
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loading || !emailExists || loginForm.invalid">
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading">Signing in...</span>
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/register">Create account</a></p>
      </div>
    </form>
  </div>
</div>
